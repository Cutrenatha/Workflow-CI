name: CI - MLflow Training & Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    env:
      DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
      DAGSHUB_REPO: ${{ secrets.DAGSHUB_REPO }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/credit-scoring-model

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version
          echo "DAGSHUB_USER=$DAGSHUB_USER"
          echo "DAGSHUB_REPO=$DAGSHUB_REPO"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.5.2 pandas==2.2.3 numpy==1.26.4 matplotlib==3.9.2 seaborn==0.13.2 joblib==1.4.2

      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/${DAGSHUB_USER}/${DAGSHUB_REPO}.mlflow" >> $GITHUB_ENV

      - name: Run mlflow project
        run: |
          cd MLProject
          mlflow run . --env-manager=local -P train_path=./credit_scoring_preprocessing/train.csv -P test_path=./credit_scoring_preprocessing/test.csv -P target_col=Risk -P n_estimators=100 -P max_depth=10 -P random_state=42

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(cat MLProject/latest_run_id.txt)
          echo "MLFLOW_RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest Run ID: $RUN_ID"

      - name: Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts-${{ github.run_id }}
          path: |
            MLProject/training_confusion_matrix.png
            MLProject/feature_importance.png
            MLProject/classification_report.json
            MLProject/latest_run_id.txt
          retention-days: 30

      - name: Build Docker Model
        run: |
          cat > Dockerfile << 'DOCKEREOF'
          FROM python:3.12-slim
          WORKDIR /app
          RUN pip install --no-cache-dir mlflow==2.19.0 scikit-learn==1.5.2 pandas==2.2.3 numpy==1.26.4 joblib==1.4.2
          EXPOSE 8080
          CMD ["mlflow", "models", "serve", "--host", "0.0.0.0", "--port", "8080", "--no-conda", "--env-manager=local"]
          DOCKEREOF
          docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE_NAME }}:run-${{ github.run_number }}

      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:run-${{ github.run_number }}

      - name: Post Log in to Docker Hub
        if: always()
        run: docker logout

      - name: Post Set up Python 3.12.7
        if: always()
        run: echo "Post step complete"

      - name: Post Run actions/checkout@v3
        if: always()
        run: echo "Checkout post step complete"

      - name: Complete job
        run: echo "CI pipeline completed successfully!"